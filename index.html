
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>
<style>
html,body{
  margin:0;
  padding:0;
  background:#000;
  height:100%;
}
.video-wrap{
  position:fixed;
  inset:0;
}
video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}
</style>
</head>
<body>

<div class="video-wrap">
  <video id="v" controls playsinline preload="metadata">
    <!-- taruh file video di folder yang sama -->
    <source src="video.mp4" type="video/mp4">
  </video>
</div>

<script>
const adLink = "https://www.effectivegatecpm.com/yqgzu19x?key=6f6c30a0d6ac3806652df8df0e376cc0";
let firstPlay = true;

const v = document.getElementById("v");

v.addEventListener("play", () => {
  if(firstPlay){
    firstPlay = false;
    window.open(adLink, "_blank");
  }
});
</script>

</body>
</html>
