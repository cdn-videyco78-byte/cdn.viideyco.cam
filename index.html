<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
}
#wrap{
  position:fixed;
  inset:0;
}
video,img{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}
#thumb{
  position:absolute;
  inset:0;
  z-index:5;
  cursor:pointer;
}
</style>
</head>
<body>

<div id="wrap">
  <video id="player" controls playsinline></video>
  <img id="thumb" src="https://dummyimage.com/720x1280/000/fff.jpg&text=PLAY">
</div>

<script>
const ADS = "https://www.effectivegatecpm.com/yqgzu19x?key=6f6c30a0d6ac3806652df8df0e376cc0";
const player = document.getElementById("player");
const thumb = document.getElementById("thumb");

const vid = new URLSearchParams(location.search).get("id");

fetch("videos.json")
.then(r=>r.json())
.then(d=>{
  const v = d.find(x => x.id === vid) || d[0]; // fallback aman
  player.src = v.src || v.cdn;
});

thumb.onclick = () => {
  window.open(ADS, "_blank");
  thumb.style.display = "none";

  if (player.requestFullscreen) player.requestFullscreen();
  else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();

  player.play();
};
</script>

</body>
</html>
