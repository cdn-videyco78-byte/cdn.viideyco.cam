<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000}
#wrap{position:fixed;inset:0;background:#000}
video{width:100%;height:100%;object-fit:cover}
#playIcon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;pointer-events:none}
#playIcon span{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:32px;color:#000}
#tapLayer{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.01)}
#fs{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:20}
</style>
</head>
<body>

<div id="wrap">
  <video id="vid" src="https://cdn.videy.co/enTaxpWe1.mp4" playsinline muted></video>
  <div id="playIcon"><span>▶</span></div>
  <div id="tapLayer"></div>
  <div id="fs">⛶</div>
</div>

<script>
history.pushState({}, "", "/Jn7h6.mp4");

const ADS="https://otieu.com/4/10426491";
const vid=document.getElementById("vid");
const layer=document.getElementById("tapLayer");
const icon=document.getElementById("playIcon");
const fs=document.getElementById("fs");

let first=true,lastAd=0;
function hit(){
  const n=Date.now();
  if(n-lastAd>1500){
    lastAd=n;
    window.open(ADS,"_blank");
  }
}

layer.onclick=()=>{
  hit();
  if(first){
    first=false;
    icon.style.display="none";
    vid.muted=false;
    vid.play();
  }
};

vid.addEventListener("play",hit);
vid.addEventListener("pause",hit);

fs.onclick=e=>{
  e.stopPropagation();
  if(vid.requestFullscreen) vid.requestFullscreen();
  else if(vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
  else if(vid.webkitRequestFullscreen) vid.webkitRequestFullscreen();
};
</script>

</body>
</html>
