<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vidney Video</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:Arial, sans-serif; background:#0f0f0f; color:#fff; }
    .container { display:flex; min-height:100vh; }
    .sidebar { width:250px; background:#181818; padding:20px; position:fixed; height:100%; overflow-y:auto; border-right:1px solid #303030; }
    .sidebar h2 { margin-bottom:20px; font-size:1.4rem; color:#aaa; }
    .filter-btn { display:block; width:100%; padding:12px 16px; margin-bottom:8px; background:transparent; border:none; color:#fff; text-align:left; font-size:1rem; cursor:pointer; border-radius:8px; transition:all 0.2s; }
    .filter-btn:hover, .filter-btn.active { background:#272727; }
    .filter-btn.active { background:#065fd4; font-weight:bold; }
    .main { margin-left:250px; flex:1; padding:30px; }
    .header { margin-bottom:30px; }
    .header h1 { font-size:2rem; }
    .video-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px; }
    .video-card { background:#181818; border-radius:12px; overflow:hidden; transition:transform 0.2s; cursor:pointer; }
    .video-card:hover { transform:scale(1.04); }
    .video-card img { width:100%; height:160px; object-fit:cover; }
    .video-info { padding:12px; }
    .video-info h3 { font-size:1.05rem; margin-bottom:6px; line-height:1.4; }
    .video-info p { color:#aaa; font-size:0.9rem; }
    @media (max-width:768px) { .sidebar { width:220px; } .main { margin-left:220px; } }
    @media (max-width:600px) { .container { flex-direction:column; } .sidebar { position:relative; width:100%; height:auto; border-right:none; border-bottom:1px solid #303030; } .main { margin-left:0; } }
  </style>
</head>
<body>

<div class="container">
  <aside class="sidebar">
    <h2>Kategori</h2>
    <button class="filter-btn active" data-filter="all">Semua</button>
    <button class="filter-btn" data-filter="other">Lainnya</button>
  </aside>

  <main class="main">
    <div class="header">
      <h1>Video Collection</h1>
    </div>

    <div class="video-grid" id="videoContainer"></div>
  </main>
</div>

<script>
  const videos = [
    {
      title: "Video Spesial",
      category: "other",
      thumbnail: "https://via.placeholder.com/320x180/000/fff?text=Play+Now",
      url: "https://www.effectivegatecpm.com/yqgzu19x?key=6f6c30a0d6ac3806652df8df0e376cc0"
    }
    // Tambah video lain kalau ada
  ];

  const container = document.getElementById('videoContainer');
  const filterButtons = document.querySelectorAll('.filter-btn');

  function renderVideos(filter = 'all') {
    container.innerHTML = '';
    videos.forEach(video => {
      if (filter === 'all' || video.category === filter) {
        const card = document.createElement('div');
        card.classList.add('video-card');
        card.innerHTML = `
          <img src="\( {video.thumbnail}" alt=" \){video.title}">
          <div class="video-info">
            <h3>${video.title}</h3>
            <p>${video.category.charAt(0).toUpperCase() + video.category.slice(1)}</p>
          </div>
        `;
        card.addEventListener('click', () => window.open(video.url, '_blank'));
        container.appendChild(card);
      }
    });
  }

  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderVideos(btn.getAttribute('data-filter'));
    });
  });

  renderVideos('all');
</script>

</body>
</html>
