<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>
<style>
body{margin:0;background:#000}
#wrap{position:fixed;inset:0}
video{width:100%;height:100%;object-fit:cover;background:#000}
#playIcon{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  z-index:5;pointer-events:none
}
#playIcon span{
  width:90px;height:90px;border-radius:50%;
  background:rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center;
  font-size:36px;color:#000
}
#tapLayer{position:absolute;inset:0;z-index:10}
#bar{
  position:absolute;left:0;right:0;bottom:0;
  padding:10px;
  background:linear-gradient(to top,rgba(0,0,0,.7),transparent);
  color:#fff;font-size:12px;z-index:20
}
#row{display:flex;justify-content:space-between}
#progress{height:4px;background:rgba(255,255,255,.3);margin-top:6px}
#fill{width:0%;height:100%;background:#fff}
#fs{cursor:pointer}
</style>
</head>
<body>

<div id="wrap">
  <video id="vid" muted controls></video>
  <div id="playIcon"><span>▶</span></div>

  <div id="bar">
    <div id="row">
      <div id="time">0:00 / 0:00</div>
      <div id="fs">⛶</div>
    </div>
    <div id="progress"><div id="fill"></div></div>
  </div>

  <div id="tapLayer"></div>
</div>

<script>
const ADS="https://www.effectivegatecpm.com/yqgzu19x?key=6f6c30a0d6ac3806652df8df0e376cc0";

const vid=document.getElementById("vid");
const layer=document.getElementById("tapLayer");
const icon=document.getElementById("playIcon");
const timeEl=document.getElementById("time");
const fill=document.getElementById("fill");
const bar=document.getElementById("progress");
const fs=document.getElementById("fs");

let first=true;
let lastAd=0;

function hitAds(){
  const n=Date.now();
  if(n-lastAd>2000){
    lastAd=n;
    window.open(ADS,"_blank");
  }
}

const vidId=new URLSearchParams(location.search).get("id");

fetch("videos.json")
.then(r=>r.json())
.then(d=>{
  const v=d.find(x=>x.id===vidId)||d[0];
  vid.src=v.src||v.cdn;
});

layer.onclick=()=>{
  hitAds();
  if(first){
    first=false;
    icon.style.display="none";
    vid.muted=false;

    if(vid.requestFullscreen) vid.requestFullscreen();
    else if(vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
    else if(vid.webkitRequestFullscreen) vid.webkitRequestFullscreen();

    vid.play();
  }
};

vid.addEventListener("timeupdate",()=>{
  if(!isNaN(vid.duration)){
    fill.style.width=(vid.currentTime/vid.duration*100)+"%";
    const f=t=>Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0");
    timeEl.textContent=f(vid.currentTime)+" / "+f(vid.duration);
  }
});

bar.onclick=e=>{
  e.stopPropagation();
  const r=bar.getBoundingClientRect();
  vid.currentTime=((e.clientX-r.left)/r.width)*vid.duration;
  hitAds();
};

fs.onclick=e=>{
  e.stopPropagation();
  if(vid.requestFullscreen) vid.requestFullscreen();
  else if(vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
  else if(vid.webkitRequestFullscreen) vid.webkitRequestFullscreen();
};
</script>

</body>
</html>
