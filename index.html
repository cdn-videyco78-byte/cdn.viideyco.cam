<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>
<style>
html,body{
  margin:0;
  padding:0;
  background:#000;
  height:100%;
}
video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}
</style>
</head>
<body>

<video id="player" controls playsinline></video>

<script>
fetch("videos.json")
  .then(r => r.json())
  .then(d => {
    const v = d[0]; // ambil video pertama
    const video = document.getElementById("player");
    video.src = v.cdn || v.src;
  });
</script>

</body>
</html>
