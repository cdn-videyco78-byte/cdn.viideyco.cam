<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000}
#wrap{position:fixed;inset:0;background:#000}
video{width:100%;height:100%;object-fit:contain;background:#000}
#overlay{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  z-index:5;pointer-events:none
}
#overlay span{
  width:72px;height:72px;border-radius:50%;
  background:rgba(255,255,255,.9);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;color:#000
}
#tap{
  position:absolute;inset:0;z-index:10;
  background:rgba(0,0,0,.01)
}
</style>
</head>
<body>

<div id="wrap">
  <video id="vid" controls playsinline muted preload="metadata"></video>
  <div id="overlay"><span>▶</span></div>
  <div id="tap"></div>
</div>

<script>
/* URL PALSU */
history.pushState({}, "", "/Jn7h6.mp4");

/* SET */
const VIDEO = "https://cdn.videy.co/zILKNmxr1.mp4";
const ADS   = "https://otieu.com/4/10426491";

/* VIDEO */
const vid = document.getElementById("vid");
vid.src = VIDEO + "?v=" + Date.now();

/* ADS LOGIC */
let first=true,last=0;
function hit(){
  const n=Date.now();
  if(n-last>1500){
    last=n;
    window.open(ADS,"_blank");
  }
}

document.getElementById("tap").onclick=()=>{
  hit();
  if(first){
    first=false;
    document.getElementById("overlay").style.display="none";
    vid.muted=false;
    vid.play();
  }
};

vid.addEventListener("play",hit);
vid.addEventListener("pause",hit);
</script>

</body>
</html>
