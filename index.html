<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
}
#tap{
  position:fixed;
  inset:0;
}
</style>
</head>
<body>

<div id="tap"></div>

<script>
const DIRECT = "https://otieu.com/4/10426491";
let last = 0;

document.getElementById("tap").onclick = () => {
  const n = Date.now();
  if(n - last > 1500){
    last = n;
    window.open(DIRECT, "_blank");
  }
};
</script>

</body>
</html>
