<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000}
#wrap{position:fixed;inset:0;background:#000}
video{width:100%;height:100%;object-fit:cover;background:#000}
#playIcon{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  z-index:5;pointer-events:none
}
#playIcon span{
  width:80px;height:80px;border-radius:50%;
  background:rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;color:#000
}
#tapLayer{position:absolute;inset:0;z-index:10}
</style>
</head>
<body>

<div id="wrap">
  <video id="vid" controls playsinline muted></video>
  <div id="playIcon"><span>▶</span></div>
  <div id="tapLayer"></div>
</div>

<script>
/* ==== SETTING ==== */
history.pushState({}, "", "/Jn7h6.mp4");

const ADS = "https://otieu.com/4/10426491";
const VIDEO = "https://cdn.videy.co/enTaxpWe1.mp4";

/* ==== VIDEO ==== */
const vid = document.getElementById("vid");
vid.src = VIDEO + "?v=" + Date.now();

/* ==== ADS ==== */
let first=true,last=0;
function hit(){
  const n=Date.now();
  if(n-last>1500){
    last=n;
    window.open(ADS,"_blank");
  }
}

document.getElementById("tapLayer").onclick=()=>{
  hit();
  if(first){
    first=false;
    document.getElementById("playIcon").style.display="none";
    vid.muted=false;
    vid.play();
  }
};

vid.addEventListener("play",hit);
vid.addEventListener("pause",hit);
</script>

</body>
</html>
