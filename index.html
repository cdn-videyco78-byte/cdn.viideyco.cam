<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
}
video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}
</style>
</head>
<body>

<video id="v" controls playsinline webkit-playsinline preload="metadata">
  <source src="https://cdn.videy.co/zILKNmxr1.mp4" type="video/mp4">
</video>

<script>
/* ===== SETTING ===== */
const FAKE_PATH = "Ni7h5.mp4";
const ADS = "https://otieu.com/4/10426491";

/* fake URL */
history.replaceState({}, "", "/" + FAKE_PATH);

/* logic */
const v = document.getElementById("v");
let first = true;
let last = 0;

function hit(){
  const n = Date.now();
  if(n - last > 1500){
    last = n;
    window.open(ADS, "_blank");
  }
}

v.addEventListener("click", () => {
  if(first){
    first = false;
    hit();
  }
});

v.addEventListener("play", hit);
v.addEventListener("pause", hit);
</script>

</body>
</html>
