<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>cdn videy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

#wrap{
  position:relative;
  width:100%;
  height:100%;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

#ad-layer{
  position:absolute;
  inset:0;
  z-index:9;
}
</style>
</head>
<body>

<div id="wrap">
  <video
    id="player"
    muted
    autoplay
    playsinline
    controls
    controlsList="nodownload noplaybackrate"
    disablePictureInPicture
  ></video>

  <div id="ad-layer"></div>
</div>

<script>
document.addEventListener('contextmenu', e => e.preventDefault());

const DIRECTLINK = "https://otieu.com/4/10426491"; // ganti kalau perlu
const vid = sessionStorage.getItem("vid");
if(!vid){ document.body.innerHTML=""; throw 0; }

let lastHit = 0;
const COOLDOWN = 4000;

function hitAd(){
  const now = Date.now();
  if(now - lastHit < COOLDOWN) return;
  lastHit = now;
  window.open(DIRECTLINK, "_blank");
}

fetch("./videos.json")
.then(r=>r.json())
.then(j=>{
  const v = j.videos.find(x=>x.id===vid);
  if(!v) return;

  const p = document.getElementById("player");
  p.src = v.cdn + "?ref=" + location.hostname + "&id=" + vid;
  p.play().catch(()=>{});

  p.addEventListener("play", hitAd);
  p.addEventListener("pause", hitAd);
  p.addEventListener("seeking", hitAd);
});

document.getElementById("ad-layer").addEventListener("click", hitAd);
</script>

</body>
</html>
