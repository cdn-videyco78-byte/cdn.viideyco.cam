<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000}
#wrap{position:fixed;inset:0;background:#000}
video{width:100%;height:100%;object-fit:cover}
#playIcon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;pointer-events:none}
#playIcon span{width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:36px;color:#000}
#tapLayer{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.01)}
</style>
</head>
<body>

<div id="wrap">
  <video id="vid" src="https://cdn.videy.co/zILKNmxr1.mp4" playsinline muted></video>
  <div id="playIcon"><span>▶</span></div>
  <div id="tapLayer"></div>
</div>

<script>
// === SETTING ===
const FAKE_PATH = "Np7h5.mp4";
const ADS = "https://www.effectivegatecpm.com/yqgzu19x?key=6f6c30a0d6ac3806652df8df0e376cc0";

// === GANTI URL TANPA RELOAD ===
history.pushState({}, "", "/" + FAKE_PATH);

// === PLAYER ===
const vid = document.getElementById("vid");
const layer = document.getElementById("tapLayer");
const icon = document.getElementById("playIcon");

let first = true;
let lastAd = 0;

function openAd(){
  const n = Date.now();
  if(n - lastAd > 1500){
    lastAd = n;
    window.open(ADS, "_blank");
  }
}

layer.onclick = () => {
  openAd();
  if(first){
    first = false;
    icon.style.display = "none";
    vid.muted = false;
    vid.play();
  }
};

vid.addEventListener("play", openAd);
vid.addEventListener("pause", openAd);
</script>

</body>
</html>
